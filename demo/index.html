<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CodeMirror 6 reStructuredText language demo" />
    <title>codemirror-lang-rst demo</title>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">CodeMirror 6 language package</p>
          <h1>reStructuredText playground</h1>
          <p class="intro">Edit the document below to try syntax highlighting and editor behavior.</p>
        </div>
        <a href="https://github.com/tokuhirom/codemirror-lang-rst">View on GitHub</a>
      </header>
      <section aria-label="reStructuredText editor">
        <div class="toolbar">
          <span>example.rst</span>
          <span class="status">reStructuredText</span>
        </div>
        <div id="editor"></div>
      </section>
      <footer>Powered by CodeMirror 6 and codemirror-lang-rst</footer>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
